name: Daily site maintenance

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-site-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Apply one daily maintenance fix
        run: npm run autopilot:daily-maintenance

      - name: Detect maintenance changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Daily site maintenance"
              echo
              echo "No deterministic fix was available, so no PR was created."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Daily site maintenance"
              echo
              echo "A bounded maintenance fix was applied and the workflow will build the site and open a PR."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Astro site
        if: steps.changes.outputs.changed == 'true'
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/daily-site-maintenance
          delete-branch: true
          commit-message: Apply daily site maintenance fix
          title: Apply daily site maintenance fix
          body: |
            Daily maintenance automation draft.

            This PR applies one bounded deterministic fix to existing content:

            - image-path optimization to `.webp` when a matching asset already exists
            - missing `excerpt` fill from `metaDescription`
            - missing `heroImage` fill from `image`
            - missing `updatedAt` fill
            - missing `buyingTiers` fill on best-parts pages
            - missing `relatedBest` fill on problem pages

            It also runs the site build and leaves the result for review before merge.
          labels: |
            maintenance
            automation
