name: Daily site maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-site-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded daily maintenance fixes
        run: npm run autopilot:daily-maintenance

      - name: Detect maintenance changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Daily site maintenance"
              echo
              echo "No deterministic fix was available, so nothing was committed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Daily site maintenance"
              echo
              echo "Up to four bounded content-quality fixes were applied and the workflow will build the site and push them directly to main."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Astro site
        if: steps.changes.outputs.changed == 'true'
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Commit and push maintenance fix
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply daily site maintenance fix"
          git push origin main
          {
            echo
            echo "Build passed and maintenance changes were pushed directly to main."
          } >> "$GITHUB_STEP_SUMMARY"
