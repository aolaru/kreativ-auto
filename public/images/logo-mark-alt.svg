<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title>Kreativ Auto alternate logo mark</title>
  <defs>
    <linearGradient id="ka-alt-bg" x1="16" y1="10" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172033" />
      <stop offset=".58" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="ka-alt-accent" x1="28" y1="24" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset=".48" stop-color="#f97316" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#ka-alt-bg)" />
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".1" />

  <path d="M34 29h60" stroke="url(#ka-alt-accent)" stroke-width="7" stroke-linecap="round" />
  <path d="M34 99h60" stroke="url(#ka-alt-accent)" stroke-width="7" stroke-linecap="round" />

  <text
    x="64"
    y="62"
    fill="#f8fafc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="800"
    text-anchor="middle"
    dominant-baseline="central"
  >KA</text>
  <text
    x="64"
    y="85"
    fill="url(#ka-alt-accent)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="800"
    text-anchor="middle"
    dominant-baseline="central"
  >AUTO</text>
</svg>
